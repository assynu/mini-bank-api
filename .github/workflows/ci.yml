name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build installDist

      - name: Start API and database
        run: docker compose --profile app up --build --detach

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail -X POST localhost:8080/accounts \
                 -H 'Content-Type: application/json' \
                 -d '{"owner":"CI","currency":"PLN"}'; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile app logs app
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose --profile app down --volumes