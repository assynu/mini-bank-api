services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: minibank
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U minibank -d minibank" ]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: mini-bank-api
    profiles: [ app ]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/minibank
      DATABASE_USERNAME: minibank
      DATABASE_PASSWORD: minibank
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: